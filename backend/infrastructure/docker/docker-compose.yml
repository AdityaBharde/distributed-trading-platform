version: '3.8'

networks:
  trading-network:
    driver: bridge

volumes:
  kafka-data:
  postgres-data:
  redis-data:

services:
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    networks:
      - trading-network
    ports:
      - "9092:9092"
    environment:
      # KRaft mode (single node acts as broker + controller, no ZooKeeper)
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Replication and durability
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1

      # Performance
      KAFKA_NUM_NETWORK_THREADS: 3
      KAFKA_NUM_IO_THREADS: 8
      KAFKA_SOCKET_SEND_BUFFER_BYTES: 102400
      KAFKA_SOCKET_RECEIVE_BUFFER_BYTES: 102400
      KAFKA_SOCKET_REQUEST_MAX_BYTES: 104857600

      # Log retention
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000

      # Group coordinator
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 3000

      # Compression
      KAFKA_COMPRESSION_TYPE: snappy

      # Auto topic creation (disable in production)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  service-registry:
    build: ../../infrastructure/service-registry
    container_name: service-registry
    networks:
      - trading-network
    ports:
      - "8761:8761"
    environment:
      - JAVA_TOOL_OPTIONS=-Xms256m -Xmx512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  api-gateway:
    build: ../../services/api-gateway
    container_name: api-gateway
    networks:
      - trading-network
    ports:
      - "8080:8080"
    depends_on:
      service-registry:
        condition: service_healthy
      redis:
        condition: service_healthy   # rate limiting; /auth/** refuses requests when Redis is down
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
      - SECURITY_JWT_JWK_SET_URI=http://identity-service:8083/.well-known/jwks.json
      - SPRING_DATA_REDIS_HOST=redis
      - JAVA_TOOL_OPTIONS=-Xms256m -Xmx512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # One Postgres instance: TimescaleDB + pgvector + pg_trgm (see init-db/01-init.sh).
  # Databases: quantanatara (platform), orderdb (trading-service), analyticsdb (analytics-service), identitydb (identity-service).
  postgres:
    image: timescale/timescaledb-ha:pg16
    container_name: postgres
    networks:
      - trading-network
    environment:
      POSTGRES_DB: quantanatara
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/home/postgres/pgdata
      - ./init-db:/docker-entrypoint-initdb.d:ro
    ports:
      # Host port 5434, not 5432: a native Windows PostgreSQL often owns 5432 and silently
      # captures `localhost:5432` (and 5433 is commonly taken too). Containers still use postgres:5432.
      - "5434:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quantanatara"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: redis
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - trading-network
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Trading deployable: order management + matching engine (modules = packages)
  trading-service:
    build: ../../services/trading-service
    container_name: trading-service
    networks:
      - trading-network
    ports:
      - "8081:8081"
    depends_on:
      kafka:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SECURITY_JWT_JWK_SET_URI=http://identity-service:8083/.well-known/jwks.json
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/orderdb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - JAVA_TOOL_OPTIONS=-Xms256m -Xmx512m -XX:+UseSerialGC
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # Market deployable: market data (+ realtime gateway later)
  market-service:
    build: ../../services/market-service
    container_name: market-service
    networks:
      - trading-network
    ports:
      - "8082:8082"
    depends_on:
      service-registry:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
      - SECURITY_JWT_JWK_SET_URI=http://identity-service:8083/.well-known/jwks.json
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx384m -XX:+UseSerialGC
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Analytics deployable: indicators, screener, alerts, notifications (later)
  analytics-service:
    build: ../../services/analytics-service
    container_name: analytics-service
    networks:
      - trading-network
    ports:
      - "8084:8084"
    depends_on:
      service-registry:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
      - SECURITY_JWT_JWK_SET_URI=http://identity-service:8083/.well-known/jwks.json
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx384m -XX:+UseSerialGC
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Identity deployable: users, authentication (JWT) and profiles. Owns the `identitydb` database.
  identity-service:
    build: ../../services/identity-service
    container_name: identity-service
    networks:
      - trading-network
    ports:
      - "8083:8083"
    depends_on:
      service-registry:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy   # per-account login lockout counters
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/identitydb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx384m -XX:+UseSerialGC
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
