spring.application.name=identity-service
server.port=8083

# Database (own database: identitydb)
spring.datasource.url=jdbc:postgresql://localhost:5434/identitydb
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the schema (db/migration). Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
# Don't keep a DB connection open while the view/JSON is rendered
spring.jpa.open-in-view=false

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
