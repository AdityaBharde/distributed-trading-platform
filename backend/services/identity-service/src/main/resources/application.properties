spring.application.name=identity-service
server.port=8083

# Database (own database: identitydb)
spring.datasource.url=jdbc:postgresql://localhost:5434/identitydb
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the schema (db/migration). Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
# Don't keep a DB connection open while the view/JSON is rendered
spring.jpa.open-in-view=false

# JWT access tokens: short-lived because a JWT cannot be revoked before it expires
jwt.issuer=identity-service
jwt.access-token-ttl=15m
# Refresh tokens: absolute session cap. Rotated tokens keep the original expiry, so a session ends 30 days after login.
jwt.refresh-token-ttl=30d

# Redis: per-account login lockout counters
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=500ms
login.max-failures=5
login.lock-duration=15m

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
