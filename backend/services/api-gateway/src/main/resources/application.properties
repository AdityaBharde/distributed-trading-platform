spring.application.name=api-gateway
server.port=8080

# ---------------------------------------------------------------------------------------------
# Security (Step 5): the gateway is an OAuth2 resource server. It downloads identity-service's
# PUBLIC key from the JWKS endpoint and verifies every access token itself.
# ---------------------------------------------------------------------------------------------
security.jwt.jwk-set-uri=http://localhost:8083/.well-known/jwks.json
security.jwt.issuer=identity-service
# Browser origins allowed to call the gateway (handled inside the security chain so 401s carry CORS headers too)
app.cors.allowed-origins=http://localhost:3000

# ---------------------------------------------------------------------------------------------
# Redis (Step 6): token-bucket rate limiting. Short timeouts so a Redis outage is noticed fast.
# ---------------------------------------------------------------------------------------------
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms

# ---------------------------------------------------------------------------------------------
# Routes. Each deployable is reachable at /<name>/** (prefix stripped), e.g. /trading/health -> trading-service /health
#
# Rate limiting on the normal API routes: per user (JWT sub), or per IP if anonymous.
#   replenishRate = tokens added per second, burstCapacity = bucket size, requestedTokens = cost per request.
#   20/s sustained with bursts up to 40. If Redis is down these routes FAIL OPEN (Spring's default).
# ---------------------------------------------------------------------------------------------
spring.cloud.gateway.server.webflux.routes[0].id=trading-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://trading-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/trading/**
spring.cloud.gateway.server.webflux.routes[0].filters[0].name=StripPrefix
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.parts=1
spring.cloud.gateway.server.webflux.routes[0].filters[1].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[0].filters[1].args.key-resolver=#{@userOrIpKeyResolver}
spring.cloud.gateway.server.webflux.routes[0].filters[1].args.redis-rate-limiter.replenishRate=20
spring.cloud.gateway.server.webflux.routes[0].filters[1].args.redis-rate-limiter.burstCapacity=40
spring.cloud.gateway.server.webflux.routes[0].filters[1].args.redis-rate-limiter.requestedTokens=1

spring.cloud.gateway.server.webflux.routes[1].id=market-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://market-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/market/**
spring.cloud.gateway.server.webflux.routes[1].filters[0].name=StripPrefix
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.parts=1
spring.cloud.gateway.server.webflux.routes[1].filters[1].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[1].filters[1].args.key-resolver=#{@userOrIpKeyResolver}
spring.cloud.gateway.server.webflux.routes[1].filters[1].args.redis-rate-limiter.replenishRate=20
spring.cloud.gateway.server.webflux.routes[1].filters[1].args.redis-rate-limiter.burstCapacity=40
spring.cloud.gateway.server.webflux.routes[1].filters[1].args.redis-rate-limiter.requestedTokens=1

spring.cloud.gateway.server.webflux.routes[2].id=analytics-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://analytics-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/analytics/**
spring.cloud.gateway.server.webflux.routes[2].filters[0].name=StripPrefix
spring.cloud.gateway.server.webflux.routes[2].filters[0].args.parts=1
spring.cloud.gateway.server.webflux.routes[2].filters[1].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[2].filters[1].args.key-resolver=#{@userOrIpKeyResolver}
spring.cloud.gateway.server.webflux.routes[2].filters[1].args.redis-rate-limiter.replenishRate=20
spring.cloud.gateway.server.webflux.routes[2].filters[1].args.redis-rate-limiter.burstCapacity=40
spring.cloud.gateway.server.webflux.routes[2].filters[1].args.redis-rate-limiter.requestedTokens=1

# Existing order API (kept un-prefixed for current clients); served by trading-service
spring.cloud.gateway.server.webflux.routes[3].id=orders
spring.cloud.gateway.server.webflux.routes[3].uri=lb://trading-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/orders/**
spring.cloud.gateway.server.webflux.routes[3].filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[3].filters[0].args.key-resolver=#{@userOrIpKeyResolver}
spring.cloud.gateway.server.webflux.routes[3].filters[0].args.redis-rate-limiter.replenishRate=20
spring.cloud.gateway.server.webflux.routes[3].filters[0].args.redis-rate-limiter.burstCapacity=40
spring.cloud.gateway.server.webflux.routes[3].filters[0].args.redis-rate-limiter.requestedTokens=1

# Auth API (identity-service). Strict and FAIL CLOSED:
#  - RequireRedis answers 503 when Redis is unreachable (no limiter = no login).
#  - Per-IP bucket: 60 tokens, refill 1/s, each request costs 12 -> a burst of 5, then one request every 12 s (5/min).
spring.cloud.gateway.server.webflux.routes[4].id=identity-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://identity-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/auth/**
spring.cloud.gateway.server.webflux.routes[4].filters[0].name=RequireRedis
spring.cloud.gateway.server.webflux.routes[4].filters[1].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[4].filters[1].args.key-resolver=#{@ipKeyResolver}
spring.cloud.gateway.server.webflux.routes[4].filters[1].args.redis-rate-limiter.replenishRate=1
spring.cloud.gateway.server.webflux.routes[4].filters[1].args.redis-rate-limiter.burstCapacity=60
spring.cloud.gateway.server.webflux.routes[4].filters[1].args.redis-rate-limiter.requestedTokens=12
# The shared secret is for the gateway only: strip it (after the limiter has read it) before forwarding
spring.cloud.gateway.server.webflux.routes[4].filters[2].name=RemoveRequestHeader
spring.cloud.gateway.server.webflux.routes[4].filters[2].args.name=X-BFF-Secret

# Profile API (identity-service). Per-user limit, like the other API routes.
spring.cloud.gateway.server.webflux.routes[5].id=profile
spring.cloud.gateway.server.webflux.routes[5].uri=lb://identity-service
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/profile/**
spring.cloud.gateway.server.webflux.routes[5].filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[5].filters[0].args.key-resolver=#{@userOrIpKeyResolver}
spring.cloud.gateway.server.webflux.routes[5].filters[0].args.redis-rate-limiter.replenishRate=20
spring.cloud.gateway.server.webflux.routes[5].filters[0].args.redis-rate-limiter.burstCapacity=40
spring.cloud.gateway.server.webflux.routes[5].filters[0].args.redis-rate-limiter.requestedTokens=1

# The Next.js server (BFF) proves who it is with this secret; only then is its X-Forwarded-For (the browser's IP)
# believed. Empty = nobody is trusted. Set BFF_SHARED_SECRET to the same value here and in the frontend.
app.bff.shared-secret=${BFF_SHARED_SECRET:}

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
