spring.application.name=api-gateway
server.port=8080

# Routes. Each deployable is reachable at /<name>/** (prefix stripped), e.g. /trading/health -> trading-service /health
spring.cloud.gateway.server.webflux.routes[0].id=trading-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://trading-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/trading/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[1].id=market-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://market-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/market/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[2].id=analytics-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://analytics-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/analytics/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=1

# Existing order API (kept un-prefixed for current clients); served by trading-service
spring.cloud.gateway.server.webflux.routes[3].id=orders
spring.cloud.gateway.server.webflux.routes[3].uri=lb://trading-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/orders/**

eureka.client.service-url.defaultZone=http://localhost:8761/eureka


# CORS Configuration
spring.cloud.gateway.globalcors.cors-configurations.[*].allowed-origins=http://localhost:3000
spring.cloud.gateway.globalcors.cors-configurations.[*].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[*].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[*].allow-credentials=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
