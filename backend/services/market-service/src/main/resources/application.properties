spring.application.name=market-service
server.port=8082

# Database (own database: marketdb). Flyway owns the schema (db/migration).
spring.datasource.url=jdbc:postgresql://localhost:5434/marketdb
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# Instrument import (NSE public CSV files). Runs at startup if data is older than 24 h, and daily (India time).
market.import.enabled=true
market.import.cron=0 0 8 * * *
market.import.equity-list-url=https://nsearchives.nseindia.com/content/equities/EQUITY_L.csv
market.import.nifty500-url=https://nsearchives.nseindia.com/content/indices/ind_nifty500list.csv
market.import.user-agent=Mozilla/5.0 (generic-client)
# Fewer rows than this means a broken or partial file: the import is rejected
market.import.min-equity-rows=2000
market.import.min-nifty500-rows=450

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Security (Step 5): re-check JWTs with identity-service public key (defence in depth; the gateway checks too)
security.jwt.jwk-set-uri=http://localhost:8083/.well-known/jwks.json
security.jwt.issuer=identity-service
